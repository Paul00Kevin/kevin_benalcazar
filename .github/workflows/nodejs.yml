name: Node.js CI

on:
  push:
    branches: [ benalcazar ]
  pull_request: [ benalcazar ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias
      run: npm install

    - name: Ejecutar pruebas
      run: npm test -- --ci
